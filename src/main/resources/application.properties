spring.application.name=order_service
server.port=8082

# Database Connection properties
spring.datasource.url=jdbc:postgresql://localhost:5432/liquorservices?currentSchema=order_service
spring.datasource.username=postgres
spring.datasource.password=admin

# Hibernate Schema Setting
spring.jpa.properties.hibernate.default_schema=order_service

# Hibernate (JPA) Config properties

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.format-sql=true